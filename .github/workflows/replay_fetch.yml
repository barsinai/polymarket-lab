name: Fetch trades for market-making replay

on:
  workflow_dispatch:
    inputs:
      refetch:
        description: "re-download everything (adds the wallet column)"
        type: boolean
        default: false
  schedule:
    - cron: "29 */6 * * *"
  push:
    branches: [main]
    paths: ["research/replay_mm_fetch.py"]

permissions:
  contents: write

concurrency:
  group: replay-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research
            data/live/rewards
            data/replay_mm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: REFETCH=${{ inputs.refetch && '1' || '0' }} BUDGET_MIN=300 python -u research/replay_mm_fetch.py 2>&1 | tee /tmp/rf.txt
      - name: Save
        if: always()
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p logs data/replay_mm && cp /tmp/rf.txt logs/replay-fetch-log.txt
          git add --sparse data/replay_mm logs/replay-fetch-log.txt
          git commit -qm "Replay trades [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep $((RANDOM % 10 + 3)); done
