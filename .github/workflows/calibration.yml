name: Phase 1 - collect data and run calibration study

on:
  workflow_dispatch:
    inputs:
      args:
        description: "extra args for collect.py"
        default: ""
  push:
    branches: [main]
    paths: ["research/collect.py", "research/analyze_calibration.py", ".github/workflows/calibration.yml"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect raw data
        run: python research/collect.py --time-budget-min 150 ${{ inputs.args }} 2>&1 | tee collect-log.txt
      - name: Analyze (offline, from saved data)
        run: python research/analyze_calibration.py 2>&1 | tee analyze-log.txt
      - name: Commit data and results
        if: always()
        run: |
          mkdir -p results logs && mv collect-log.txt analyze-log.txt logs/ 2>/dev/null || true
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data results logs
          git commit -m "Data + calibration results $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main && git push
