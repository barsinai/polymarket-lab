name: Pilot (live account; mode from research/live/PILOT_MODE)

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */2 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: pilot
  cancel-in-progress: false

jobs:
  run:
    # GitHub's hosted runners are in the US, which Polymarket blocks (also on the API): the pilot runs on
    # our own small server in an allowed country, registered as a self-hosted runner with the label "pilot".
    runs-on: [self-hosted, pilot]
    timeout-minutes: 350
    env:
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_WALLET_ADDRESS: ${{ secrets.POLYMARKET_WALLET_ADDRESS }}
      POLYMARKET_RELAYER_API_KEY: ${{ secrets.POLYMARKET_RELAYER_API_KEY }}
      POLYMARKET_SIGNER_ADDRESS: ${{ secrets.POLYMARKET_SIGNER_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research
            data/paper_mm2_live
            data/live_pilot
            data/live/meta
            data/live/rewards
            data/live/volfeat
            data/combos
      - name: Python 3.12 environment (uv; the server's system Python is 3.14 and externally managed)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
          [ -x "$HOME/.venv-pilot/bin/python" ] || uv venv --python 3.12 "$HOME/.venv-pilot"
          uv pip install --python "$HOME/.venv-pilot/bin/python" -q requests polymarket-client
          "$HOME/.venv-pilot/bin/python" --version
          "$HOME/.venv-pilot/bin/python" -c "import polymarket; print('polymarket-client', polymarket.__version__)"
      - name: Secrets present?
        run: |
          if [ -z "$POLYMARKET_PRIVATE_KEY" ]; then echo "no secrets yet - nothing to do"; echo "NOSECRETS=1" >> $GITHUB_ENV; fi
      - name: Tick every 10 minutes for ~5.5 hours, save hourly
        if: env.NOSECRETS != '1'
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          set +e
          end=$(( $(date +%s) + 325*60 )); last=0
          while [ "$(date +%s)" -lt "$end" ]; do
            git fetch -q origin main
            git checkout -q origin/main -- research data/live/rewards data/live/meta data/live/mids_48h.json.gz data/live/volfeat 2>/dev/null   # code + mode + data refresh every tick
            if git cat-file -e origin/main:STOP 2>/dev/null; then git checkout -q origin/main -- STOP; else rm -f STOP; fi
            "$HOME/.venv-pilot/bin/python" -u research/live/live_tick.py 2>&1 | tee -a /tmp/pilot-log.txt
            if [ -f research/combos/ENABLED ] && [ $(( $(date +%s) / 600 % 6 )) -eq 0 ]; then "$HOME/.venv-pilot/bin/python" -u research/combos/sample.py 2>&1 | tail -c 3000 | tee -a /tmp/pilot-log.txt; fi
            if [ $(( $(date +%s) - last )) -ge 0 ]; then   # pilot: save every tick
              mkdir -p logs data/live_pilot data/paper_mm2_live && cp /tmp/pilot-log.txt logs/pilot-log.txt
              git add --sparse data/live_pilot data/paper_mm2_live data/combos logs/pilot-log.txt
              if git commit -qm "Pilot $(date -u +%FT%H:%M) [skip ci]"; then
                for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep $((RANDOM % 10 + 3)); done
              fi
              last=$(date +%s)
            fi
            now=$(date +%s); sleep $(( 600 - now % 600 + 45 ))
          done
          mkdir -p logs && cp /tmp/pilot-log.txt logs/pilot-log.txt
          git add --sparse data/live_pilot data/paper_mm2_live data/combos logs/pilot-log.txt
          git commit -qm "Pilot $(date -u +%FT%H:%M) [skip ci]" && for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
      - name: Hand over to the next run
        if: always() && env.NOSECRETS != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pilot.yml/dispatches -d '{"ref":"main"}'
