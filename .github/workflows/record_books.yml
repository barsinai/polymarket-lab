name: Phase 2 - record order books

# GitHub's cron scheduler proved unreliable (new schedules didn't fire for hours), so
# the recorder runs itself: one job stays up ~5.5h taking a snapshot every 15 min, then
# re-launches this workflow before exiting. The hourly cron is only a backup restarter
# in case the chain ever breaks; the concurrency group prevents duplicates.

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["research/record_books.py", ".github/workflows/record_books.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: record-books
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research
            data/books
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Snapshot every 15 minutes for ~5.5 hours
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python research/record_books.py || echo "snapshot failed, will retry next slot"
            git add data/books
            if git commit -qm "Order book snapshot $(date -u +%FT%H:%M)"; then
              for i in 1 2 3 4 5; do
                git pull -q --rebase origin main && git push -q && break
                sleep $((RANDOM % 10 + 3))
              done
            fi
            # sleep to the next quarter hour
            now=$(date +%s); sleep $(( 900 - now % 900 + 5 ))
          done
      - name: Hand over to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run record_books.yml --ref main -R ${{ github.repository }}
