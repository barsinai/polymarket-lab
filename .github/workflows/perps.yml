name: Perps funding data (read-only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research
            data/perps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests polymarket-client
      - run: python -u research/perps/collect_funding.py 2>&1 | tee /tmp/perps.txt
      - name: Save
        if: always()
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p logs data/perps && cp /tmp/perps.txt logs/perps-log.txt
          git add --sparse data/perps logs/perps-log.txt
          git commit -qm "Perps funding data [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
