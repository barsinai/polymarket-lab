name: SDK probe (no keys)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install polymarket-client 2>&1 | tail -3
      - run: python -u research/live/sdk_probe.py 2>&1 | tee /tmp/sdk.txt
      - run: pip show -f polymarket-client | head -5; python -c "import polymarket,os; d=os.path.dirname(polymarket.__file__); print(d)"; find $(python -c "import polymarket,os; print(os.path.dirname(polymarket.__file__))") -name "*.py" | head -80 | tee -a /tmp/sdk.txt
      - name: Save
        if: always()
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p logs && cp /tmp/sdk.txt logs/sdk-probe.txt
          git add --sparse logs/sdk-probe.txt
          git commit -qm "SDK probe [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
