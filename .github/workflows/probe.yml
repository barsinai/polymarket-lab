name: Probe an API (quick look at response shape)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to GET"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: logs
      - run: |
          mkdir -p logs
          curl -sS -m 60 "${{ inputs.url }}" | head -c 6000 > logs/probe.txt || true
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add --sparse logs/probe.txt && git commit -qm "Probe [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
