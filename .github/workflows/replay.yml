name: Replay strategies over recorded live order books

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["research/replay.py", ".github/workflows/replay.yml"]

permissions:
  contents: write

concurrency:
  group: replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research
            data/live
            data/replay
            results
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scikit-learn==1.9.1
      - name: Replay and score
        run: python -u research/replay.py 2>&1 | tee /tmp/replay-log.txt
      - name: Save
        if: always()
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p logs data/replay && cp /tmp/replay-log.txt logs/replay-log.txt
          git add --sparse data/replay results/replay.json logs/replay-log.txt
          git commit -qm "Replay results [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((RANDOM % 10 + 3)); done
