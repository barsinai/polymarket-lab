name: Fast Up/Down paper bot (Finnish server, no orders)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: pilot-server
  cancel-in-progress: false
jobs:
  run:
    runs-on: [self-hosted, pilot]
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research
            data/fast
      - name: Python env
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --python "$HOME/.venv-pilot/bin/python" -q requests websockets
      - name: Run ~5.2 h in hourly parts
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git config pack.threads 1 && git config pack.windowMemory 64m && git config core.bigFileThreshold 1m && git config pack.deltaCacheSize 32m
          for part in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            # a previous publish that failed left its files in /tmp/fastout: restore them before running on
            if [ -d /tmp/fastout ]; then mkdir -p data/fast && cp -r /tmp/fastout/. data/fast/; fi
            PATH="$HOME/.local/bin:$PATH" uv pip install --python "$HOME/.venv-pilot/bin/python" -q requests websockets || true
            RUN_MIN=60 "$HOME/.venv-pilot/bin/python" -u research/fast/updown_paper.py 2>&1 | tee -a /tmp/fast.txt | grep -v "^$"
            mkdir -p logs && cp /tmp/fast.txt logs/fast-log.txt
            # publish the bot's own files on top of whatever is upstream (only the server writes these)
            mkdir -p /tmp/fastout/rtds /tmp/fastout/bookws
            for f in obs.jsonl trades.jsonl windows.jsonl model.jsonl pairs.jsonl report.json tokens.jsonl; do [ -f "data/fast/$f" ] && cp "data/fast/$f" /tmp/fastout/; done
            cp data/fast/obs-*.jsonl.gz data/fast/model-*.jsonl.gz data/fast/pairs-*.jsonl.gz /tmp/fastout/ 2>/dev/null || true
            cp data/fast/rtds/*.jsonl.gz /tmp/fastout/rtds/ 2>/dev/null || true       # finished hours only (compressed)
            cp data/fast/bookws/*.jsonl.gz /tmp/fastout/bookws/ 2>/dev/null || true
            for i in 1 2 3; do
              git fetch -q origin main && git reset -q --hard origin/main && mkdir -p data/fast/rtds logs && cp -r /tmp/fastout/. data/fast/ && cp /tmp/fast.txt logs/fast-log.txt
              if git add --sparse data/fast logs/fast-log.txt && git commit -qm "Fast paper $(date -u +%FT%H:%M) [skip ci]" && git push -q; then rm -rf /tmp/fastout; break; fi
              sleep 5
            done
          done
      - name: Hand over
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/fast_paper.yml/dispatches -d '{"ref":"main"}'
