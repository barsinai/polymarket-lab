name: Download Kalshi market list

on:
  workflow_dispatch:
    inputs:
      ties_only:
        description: "skip re-downloading the market list"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["research/external/kalshi_ties.py"]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research
            data/external
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Market list (skipped when inputs.ties_only)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.ties_only }}
        run: timeout 150m python -u research/external/kalshi.py 2>&1 | tee /tmp/k.txt || true
      - name: Tie-market price histories
        run: BUDGET_MIN=200 python -u research/external/kalshi_ties.py 2>&1 | tee -a /tmp/k.txt || true
      - name: Save
        if: always()
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p logs data/external && cp /tmp/k.txt logs/kalshi-log.txt
          git add --sparse data/external/kalshi logs/kalshi-log.txt
          git commit -qm "Kalshi markets [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((RANDOM % 10 + 3)); done
