name: Perps carry paper test (hourly, no orders)
on:
  workflow_dispatch:
  schedule:
    - cron: "2 * * * *"
permissions:
  contents: write
concurrency:
  group: perps-paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research
            data/perps/paper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests polymarket-client
      - run: python -u research/perps/paper_carry.py
      - name: Save
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add --sparse data/perps/paper
          git commit -qm "Perps paper $(date -u +%FT%H:%M) [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
