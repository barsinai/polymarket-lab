name: Run a research script (read-only)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "path under research/"
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research
            data/fast
            data/slow
            data/research
            data/history
            data/weather
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests websockets
      - run: mkdir -p logs && python -u research/${{ inputs.script }} 2>&1 | tee "logs/script-$(basename ${{ inputs.script }} .py).txt"
      - name: Save
        if: always()
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in logs data/fast data/slow data/research data/history data/weather; do [ -e "$p" ] && git add --sparse "$p"; done; git commit -qm "Script output [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
