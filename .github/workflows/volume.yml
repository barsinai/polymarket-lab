name: Phase 1b - money traded before each bet moment (all markets)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["research/collect_volume.py", ".github/workflows/volume.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: volume
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research
            data/listing
            data/volume
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Volume before bet moments (checkpoint every 30 min)
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p logs
          set -o pipefail
          python -u research/collect_volume.py --git-checkpoint 2>&1 | tee /tmp/volume-log.txt
      - name: Save log
        if: always()
        run: |
          mkdir -p logs && cp /tmp/volume-log.txt logs/volume-log.txt || true
          git add --sparse logs/volume-log.txt data/volume || true
          git commit -qm "Volume log [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((RANDOM % 10 + 3)); done
      - name: Continue if markets remain
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(cat data/volume/REMAINING 2>/dev/null || echo 0)
          echo "remaining: $left"
          if [ "$left" -gt 0 ]; then gh workflow run volume.yml --ref main -R ${{ github.repository }}; fi
